name: Collect daily card prices
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-prices.yml', 'lib/market/**', 'app/api/cron/collect-prices/**', 'db/migrations/007_card_price_history.sql']
permissions:
  id-token: write
  contents: read
concurrency:
  group: daily-card-price-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Collect the first daily snapshot, resuming bounded batches
        env:
          COLLECTOR_URL: https://www.splintiers.com/api/cron/collect-prices
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          endpoint = os.environ['COLLECTOR_URL']
          failures = 0
          for batch in range(80):
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(endpoint, safe='')
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['value']
              target = endpoint + '?commit=' + urllib.parse.quote(os.environ['GITHUB_SHA'], safe='')
              if batch == 0 and os.environ['GITHUB_EVENT_NAME'] in ('push', 'workflow_dispatch'):
                  target += '&retry=1'
              request = urllib.request.Request(target, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=300) as response:
                      result = json.load(response)
                  failures = 0
                  print(json.dumps(result), flush=True)
                  if result.get('status') == 'completed':
                      break
                  if result.get('status') == 'partial':
                      raise SystemExit('Some card editions failed after three attempts; missing observations remain gaps.')
                  if result.get('status') not in ('pending', 'busy', 'rate-limited'):
                      raise SystemExit('Unexpected collection status.')
                  time.sleep(60 if result.get('status') in ('busy', 'rate-limited') else 2)
              except (urllib.error.URLError, TimeoutError):
                  failures += 1
                  if failures >= 8:
                      raise SystemExit('Collector unavailable after retries; completed observations are retained.')
                  time.sleep(30)
          else:
              raise SystemExit('Collection did not finish within its batch budget.')
          PY
