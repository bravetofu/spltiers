name: Collect ranked battles
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-battles.yml', 'lib/ratings/**', 'app/api/cron/**']
permissions:
  id-token: write
  contents: read
concurrency:
  group: ranked-battle-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect using a short-lived GitHub identity
        env:
          COLLECTOR_URL: https://www.splintiers.com/api/cron/collect-battles
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          endpoint = os.environ['COLLECTOR_URL']
          # A push can precede the new Vercel deployment. Retry authorization
          # briefly; request a fresh identity on every attempt and never log it.
          for attempt in range(5):
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(endpoint, safe='')
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['value']
              request = urllib.request.Request(endpoint, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=300) as response:
                      result = json.load(response)
                  if os.environ['GITHUB_EVENT_NAME'] == 'push' and result.get('deploymentCommit') != os.environ['GITHUB_SHA']:
                      if attempt == 4:
                          raise SystemExit('New deployment is not ready yet; scheduled collection will retry.')
                      time.sleep(45)
                      continue
                  print(json.dumps(result))
                  if result.get('status') not in ('completed', 'busy'):
                      raise SystemExit('Collection needs attention; see the reported status.')
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 401 or attempt == 4:
                      raise SystemExit('Collector returned HTTP ' + str(error.code))
                  time.sleep(45)
          PY
